[package]
name = "bresenham"
version = "0.2.0"
authors = ["Marc Brinkmann <git@marcbrinkmann.de>", "Shane Celis <shane.celis@gmail.com>"]
license = "MIT"
edition = "2021"
readme = "README.md"
description = "A fast, iterator-based integer-only implementation of Bresenham's line algorithm."
repository = "https://github.com/mbr/bresenham-rs"
documentation = "https://mbr.github.io/bresenham-rs/bresenham"
exclude = ["demo", "graphics"]

[workspace]
members = ["demo"]
default-members = ["."]

[features]
default = ["line"]
## 2D line (`Line`; alias `Bresenham`)
line = []
## 3D line (`Line3d`; alias `Bresenham3d`)
line3d = []
## Midpoint circle (`Circle`)
circle = []
## Axis-aligned ellipses (`Ellipse`, `EllipseRect`)
ellipse = []
## Filled scanlines (`fill::HLine`, `fill::Fill`)
fill = []
## Inclusive `[start, end]` adapter for `Line` and `Line3d`
inclusive = []
## Quadratic Bézier (`QuadBezier`); implies `line`
bezier = ["line", "dep:libm"]
## Anti-aliased line, thick line, and quadratic Bézier (`LineAA`, `WideLine`, `QuadBezierAA`)
aa = ["dep:libm"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
libm = { version = "0.2", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "line"
harness = false
required-features = ["inclusive"]

[[bench]]
name = "line3d"
harness = false
required-features = ["inclusive", "line3d"]

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
