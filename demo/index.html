<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>bresenham-rs</title>
    <link
      data-trunk
      rel="rust"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-sign-ext --enable-nontrapping-float-to-int"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        width: 512px;
        height: 384px;
        cursor: crosshair;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="grid" width="64" height="48"></canvas>
  </body>
</html>
