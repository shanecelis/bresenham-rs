[package]
name = "bresenham-demo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "bresenham_demo"
path = "src/lib.rs"

[[bin]]
name = "bresenham-demo"
path = "src/main.rs"

[[bin]]
name = "record-demo"
path = "src/bin/record.rs"
required-features = ["record"]

[features]
record = ["dep:gif"]

[dependencies]
bresenham = { path = "..", default-features = false, features = [
    "line",
    "circle",
    "ellipse",
    "bezier",
    "aa",
    "fill",
] }
gif = { version = "0.13", optional = true }
wasm-bindgen = { version = "0.2", default-features = false }
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "HtmlCanvasElement",
    "HtmlElement",
    "ImageData",
    "MouseEvent",
    "Window",
] }
